<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#153b4d">
  <meta name="description" content="Billybob: The Hundred-Yard Potato — a twelve-page illustrated farm adventure.">
  <title>Billybob: The Hundred-Yard Potato</title>
  <style>
    :root {
      --sky: #8fd0ec;
      --deep-sky: #153b4d;
      --paper: #f5e5b9;
      --ink: #282018;
      --gold: #efbd45;
      --shadow: rgba(18, 24, 23, .34);
      --control: rgba(18, 31, 36, .82);
      --control-hover: rgba(18, 31, 36, .96);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--deep-sky);
    }

    body {
      margin: 0;
      color: white;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.18), transparent 36rem),
        linear-gradient(180deg, #63b7dc 0%, #d5e9cb 52%, #806b3d 100%);
      overflow-x: hidden;
    }

    button {
      font: inherit;
    }

    .masthead {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 3rem 1.25rem 7rem;
      position: relative;
      text-align: center;
      isolation: isolate;
      overflow: hidden;
    }

    .masthead::before,
    .masthead::after {
      content: "";
      position: absolute;
      inset: auto -8vw -12vh;
      height: 45vh;
      border-radius: 50% 50% 0 0;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(54, 112, 47, .95) 0 1.4rem,
          rgba(42, 92, 38, .96) 1.4rem 2.8rem
        );
      transform: perspective(30rem) rotateX(64deg);
      transform-origin: center bottom;
      z-index: -2;
      opacity: .82;
    }

    .masthead::after {
      inset: auto -20vw -17vh;
      height: 32vh;
      filter: brightness(.75);
      opacity: .55;
      z-index: -3;
    }

    .title-card {
      max-width: 58rem;
      padding: clamp(1.7rem, 5vw, 4rem);
      border: 4px solid rgba(40,32,24,.85);
      outline: 2px solid rgba(239,189,69,.8);
      outline-offset: -12px;
      color: var(--ink);
      background:
        linear-gradient(rgba(250,234,190,.94), rgba(240,213,149,.94)),
        repeating-linear-gradient(0deg, transparent 0 7px, rgba(75,49,23,.05) 7px 8px);
      box-shadow: 0 1.5rem 4rem var(--shadow);
      transform: rotate(-.25deg);
    }

    .eyebrow {
      margin: 0 0 .7rem;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 900;
      letter-spacing: .22em;
      text-transform: uppercase;
      font-size: clamp(.72rem, 2vw, .95rem);
    }

    h1 {
      margin: 0;
      line-height: .95;
      font-size: clamp(3rem, 10vw, 7.5rem);
      text-wrap: balance;
    }

    .subtitle {
      margin: 1rem 0 0;
      font-style: italic;
      font-size: clamp(1.1rem, 3vw, 1.8rem);
    }

    .start {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      margin-top: 2rem;
      padding: .85rem 1.25rem;
      border: 2px solid var(--ink);
      color: var(--ink);
      background: var(--gold);
      text-decoration: none;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .06em;
      box-shadow: .25rem .3rem 0 rgba(40,32,24,.9);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .start:hover,
    .start:focus-visible {
      transform: translate(.15rem, .15rem);
      box-shadow: .1rem .12rem 0 rgba(40,32,24,.9);
    }

    .reader {
      position: relative;
    }

    .page {
      min-height: 100svh;
      padding: clamp(4.5rem, 8vh, 6.5rem) clamp(.75rem, 3vw, 2rem) clamp(4.5rem, 8vh, 6rem);
      display: grid;
      place-items: center;
      scroll-margin-top: 0;
      scroll-snap-align: start;
      position: relative;
    }

    .page:nth-child(odd) {
      background: linear-gradient(180deg, rgba(14,45,58,.18), rgba(255,255,255,.08));
    }

    .page-frame {
      position: relative;
      max-width: min(96vw, 98rem);
      max-height: calc(100svh - 9rem);
      display: grid;
      place-items: center;
    }

    .page img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: calc(100svh - 9rem);
      object-fit: contain;
      border: clamp(4px, .55vw, 9px) solid #1f1a15;
      background: #1f1a15;
      box-shadow:
        0 1.4rem 3.2rem rgba(0,0,0,.37),
        0 0 0 2px rgba(239,189,69,.6);
    }

    .page-number {
      position: absolute;
      top: .6rem;
      right: .6rem;
      min-width: 3rem;
      padding: .55rem .7rem;
      color: var(--ink);
      background: var(--gold);
      border: 2px solid var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 900;
      text-align: center;
      box-shadow: .2rem .22rem 0 rgba(0,0,0,.65);
      transform: rotate(1deg);
      z-index: 2;
    }

    .toolbar {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: max(1rem, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: .4rem;
      padding: .45rem;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 999px;
      background: var(--control);
      box-shadow: 0 .7rem 2rem rgba(0,0,0,.3);
      backdrop-filter: blur(12px);
    }

    .toolbar button {
      width: 2.65rem;
      height: 2.65rem;
      border: 0;
      border-radius: 999px;
      color: white;
      background: transparent;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 900;
    }

    .toolbar button:hover,
    .toolbar button:focus-visible {
      background: rgba(255,255,255,.18);
      outline: none;
    }

    .counter {
      min-width: 5.2rem;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
    }

    .thumbs-toggle {
      width: auto !important;
      padding: 0 .9rem !important;
    }

    .thumbs {
      position: fixed;
      z-index: 19;
      left: 50%;
      bottom: max(5.25rem, calc(env(safe-area-inset-bottom) + 5.25rem));
      transform: translate(-50%, 1rem);
      width: min(94vw, 68rem);
      max-height: min(52vh, 31rem);
      padding: .8rem;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 1rem;
      background: rgba(18,31,36,.94);
      box-shadow: 0 1rem 3rem rgba(0,0,0,.4);
      backdrop-filter: blur(16px);
      overflow: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr));
      gap: .65rem;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease, visibility .18s;
    }

    .thumbs.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translate(-50%, 0);
    }

    .thumb {
      border: 2px solid transparent;
      border-radius: .45rem;
      padding: .25rem;
      color: white;
      background: rgba(255,255,255,.06);
      cursor: pointer;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 800;
    }

    .thumb img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      object-position: center;
      display: block;
      border-radius: .25rem;
      margin-bottom: .3rem;
    }

    .thumb.active {
      border-color: var(--gold);
      background: rgba(239,189,69,.16);
    }

    .end-note {
      min-height: 70svh;
      padding: 6rem 1.25rem 9rem;
      display: grid;
      place-items: center;
      text-align: center;
      background: linear-gradient(180deg, rgba(27,44,40,.08), rgba(24,30,23,.62));
    }

    .end-note div {
      max-width: 48rem;
      padding: 2rem;
      color: var(--ink);
      background: rgba(245,229,185,.92);
      border: 3px solid var(--ink);
      box-shadow: .4rem .45rem 0 rgba(40,32,24,.8);
    }

    .end-note h2 {
      margin: 0 0 .75rem;
      font-size: clamp(2rem, 6vw, 4rem);
    }

    .end-note p {
      margin: 0;
      font-size: clamp(1rem, 2.4vw, 1.35rem);
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .thumbs, .start { transition: none; }
    }

    @media (max-width: 650px) {
      .page {
        min-height: auto;
        padding-top: 5rem;
        padding-bottom: 5.5rem;
      }

      .page-frame,
      .page img {
        max-height: none;
      }

      .page img {
        width: 100%;
      }

      .page-number {
        top: .35rem;
        right: .35rem;
        font-size: .85rem;
      }
    }
  </style>
</head>
<body>
  <header class="masthead" id="top">
    <div class="title-card">
      <p class="eyebrow">An all-American farm adventure</p>
      <h1>Billybob:<br>The Hundred-Yard Potato</h1>
      <p class="subtitle">Every great engineer begins by wondering, “What if?”</p>
      <a class="start" href="#page-1">Read the story ↓</a>
    </div>
  </header>

  <main class="reader" id="reader" aria-label="Story pages"></main>

  <section class="end-note">
    <div>
      <h2>Dream it. Plan it. Throw it.</h2>
      <p>Use the arrow keys, the controls below, or simply scroll to read again.</p>
    </div>
  </section>

  <nav class="toolbar" aria-label="Story navigation">
    <button id="previous" type="button" aria-label="Previous page">←</button>
    <span class="counter" id="counter" aria-live="polite">Cover</span>
    <button id="next" type="button" aria-label="Next page">→</button>
    <button class="thumbs-toggle" id="thumbsToggle" type="button" aria-expanded="false">Pages</button>
  </nav>

  <aside class="thumbs" id="thumbs" aria-label="Page thumbnails"></aside>

  <script>
    (() => {
      "use strict";

      // This array is intentionally numeric, not alphabetic:
      // BB_9.png is followed by BB_10.png, BB_11.png, and BB_12.png.
      const pageFiles = Array.from({ length: 12 }, (_, index) => `BB_${index + 1}.png`);

      const reader = document.getElementById("reader");
      const thumbs = document.getElementById("thumbs");
      const counter = document.getElementById("counter");
      const previous = document.getElementById("previous");
      const next = document.getElementById("next");
      const thumbsToggle = document.getElementById("thumbsToggle");

      let currentPage = 0;

      function buildStory() {
        const pageFragment = document.createDocumentFragment();
        const thumbFragment = document.createDocumentFragment();

        pageFiles.forEach((file, index) => {
          const pageNumber = index + 1;

          const section = document.createElement("section");
          section.className = "page";
          section.id = `page-${pageNumber}`;
          section.dataset.page = String(pageNumber);
          section.setAttribute("aria-label", `Page ${pageNumber} of ${pageFiles.length}`);

          const frame = document.createElement("div");
          frame.className = "page-frame";

          const image = document.createElement("img");
          image.src = file;
          image.alt = `Billybob: The Hundred-Yard Potato, page ${pageNumber}`;
          image.loading = pageNumber <= 2 ? "eager" : "lazy";
          image.decoding = "async";

          const badge = document.createElement("span");
          badge.className = "page-number";
          badge.textContent = `${pageNumber} / ${pageFiles.length}`;

          frame.append(image, badge);
          section.append(frame);
          pageFragment.append(section);

          const thumb = document.createElement("button");
          thumb.className = "thumb";
          thumb.type = "button";
          thumb.dataset.page = String(pageNumber);
          thumb.setAttribute("aria-label", `Go to page ${pageNumber}`);

          const thumbImage = document.createElement("img");
          thumbImage.src = file;
          thumbImage.alt = "";
          thumbImage.loading = "lazy";

          const label = document.createElement("span");
          label.textContent = `Page ${pageNumber}`;

          thumb.append(thumbImage, label);
          thumb.addEventListener("click", () => {
            goToPage(pageNumber);
            setThumbs(false);
          });
          thumbFragment.append(thumb);
        });

        reader.append(pageFragment);
        thumbs.append(thumbFragment);
      }

      function setCurrentPage(pageNumber) {
        currentPage = Math.max(0, Math.min(pageFiles.length, pageNumber));
        counter.textContent = currentPage === 0
          ? "Cover"
          : `${currentPage} / ${pageFiles.length}`;

        document.querySelectorAll(".thumb").forEach((thumb) => {
          thumb.classList.toggle("active", Number(thumb.dataset.page) === currentPage);
        });

        previous.disabled = currentPage === 0;
        next.disabled = currentPage === pageFiles.length;
      }

      function goToPage(pageNumber) {
        if (pageNumber <= 0) {
          document.getElementById("top").scrollIntoView({ behavior: "smooth" });
          return;
        }
        const target = document.getElementById(`page-${pageNumber}`);
        if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function setThumbs(open) {
        thumbs.classList.toggle("open", open);
        thumbsToggle.setAttribute("aria-expanded", String(open));
      }

      buildStory();

      const observer = new IntersectionObserver((entries) => {
        const visible = entries
          .filter(entry => entry.isIntersecting)
          .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];

        if (visible) {
          setCurrentPage(Number(visible.target.dataset.page));
        }
      }, {
        threshold: [0.35, 0.55, 0.75]
      });

      document.querySelectorAll(".page").forEach(page => observer.observe(page));

      const coverObserver = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && entries[0].intersectionRatio > 0.45) {
          setCurrentPage(0);
        }
      }, { threshold: [0.45] });
      coverObserver.observe(document.getElementById("top"));

      previous.addEventListener("click", () => goToPage(currentPage - 1));
      next.addEventListener("click", () => goToPage(currentPage + 1));
      thumbsToggle.addEventListener("click", () => setThumbs(!thumbs.classList.contains("open")));

      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight" || event.key === "PageDown") {
          event.preventDefault();
          goToPage(currentPage + 1);
        } else if (event.key === "ArrowLeft" || event.key === "PageUp") {
          event.preventDefault();
          goToPage(currentPage - 1);
        } else if (event.key === "Home") {
          event.preventDefault();
          goToPage(0);
        } else if (event.key === "End") {
          event.preventDefault();
          goToPage(pageFiles.length);
        } else if (event.key === "Escape") {
          setThumbs(false);
        }
      });

      document.addEventListener("click", (event) => {
        if (!thumbs.contains(event.target) && !thumbsToggle.contains(event.target)) {
          setThumbs(false);
        }
      });
    })();
  </script>
</body>
</html>
